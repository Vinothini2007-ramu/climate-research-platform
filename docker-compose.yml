services:
  postgres:
    image: postgres:16-alpine
    container_name: climate-postgres
    environment:
      POSTGRES_DB: climate_hub
      POSTGRES_USER: climate_user
      POSTGRES_PASSWORD: climate_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  redis:
    image: redis:7-alpine
    container_name: climate-redis
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: climate-backend
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://climate_user:climate_password@postgres:5432/climate_hub
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change_this_secret_in_production
      CLIENT_URL: http://localhost:5173
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build: ./frontend
    container_name: climate-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
